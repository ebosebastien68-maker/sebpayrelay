# À INSÉRER dans le bloc "server { ... }" de /etc/nginx/sites-available/webdock,
# juste AVANT la ligne "# Webdock: Do not delete the following End Of File marker".
# Les "location =" (correspondance exacte) passent avant les règles PHP existantes.

        # Entrée unique pour Supabase (protégée par le secret x-relay-secret)
        location = /relay {
            client_max_body_size 100k;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        # Webhook SebPay (protégé par la signature HMAC, vérifiée par le relais)
        location = /webhook/sebpay {
            client_max_body_size 100k;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        location = /health {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
        }
